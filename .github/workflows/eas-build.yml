name: EAS Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

jobs:
  build:
    name: Build ${{ github.event.inputs.profile || 'preview' }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Login to Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        run: |
          eas build --platform android --profile ${{ github.event.inputs.profile || 'preview' }} --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Wait for build completion
        run: |
          BUILD_ID=""
          for i in $(seq 1 30); do
            BUILD_ID=$(eas build:list --platform android --limit 1 --json 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['id'] if d else '')")
            if [ -n "$BUILD_ID" ]; then break; fi
            sleep 10
          done
          if [ -z "$BUILD_ID" ]; then echo "No build found"; exit 1; fi
          echo "BUILD_ID=$BUILD_ID" >> $GITHUB_ENV
          echo "Waiting for build $BUILD_ID..."
          for i in $(seq 1 30); do
            STATUS=$(eas build:view --id "$BUILD_ID" --non-interactive --json 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','') if isinstance(d,dict) else '')")
            echo "Status: $STATUS"
            if [ "$STATUS" = "finished" ]; then break; fi
            if [ "$STATUS" = "errored" ] || [ "$STATUS" = "canceled" ]; then echo "Build failed with status: $STATUS"; exit 1; fi
            sleep 10
          done

      - name: Download APK artifact
        run: |
          eas build:download --artifact-path ./mr-tik.apk --build-id ${{ env.BUILD_ID }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload APK to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mr-tik-${{ github.event.inputs.profile || 'preview' }}-apk
          path: ./mr-tik.apk
          retention-days: 30