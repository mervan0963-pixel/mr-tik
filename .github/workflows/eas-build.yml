name: EAS Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

jobs:
  build:
    name: Build ${{ github.event.inputs.profile || 'preview' }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mr-tik/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: mr-tik

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Login to Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        run: |
          eas build --platform android --profile ${{ github.event.inputs.profile || 'preview' }} --non-interactive --no-wait
        working-directory: mr-tik
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Wait for build completion
        run: |
          echo "Waiting for build to complete..."
          for i in {1..30}; do
            STATUS=$(eas build:list --platform android --limit 1 --json 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['status'] if d else '')")
            if [ "$STATUS" = "finished" ]; then
              echo "Build completed successfully"
              exit 0
            elif [ "$STATUS" = "errored" ] || [ "$STATUS" = "canceled" ]; then
              echo "Build failed with status: $STATUS"
              exit 1
            fi
            sleep 10
          done
          echo "Build did not complete in time"
          exit 1

      - name: Download APK artifact
        run: |
          eas build:download --platform android --profile ${{ github.event.inputs.profile || 'preview' }} --non-interactive
          BUILD_ID=$(eas build:list --platform android --limit 1 --json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['id'])")
          eas build:download --artifact-path ./mr-tik.apk --build-id $BUILD_ID
        working-directory: mr-tik
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mr-tik-${{ github.event.inputs.profile || 'preview' }}-apk
          path: ./mr-tik.apk
          retention-days: 30